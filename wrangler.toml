name = "nikke-union-raid"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Import page.html as a text module so the worker can serve it
[[rules]]
type = "Text"
globs = ["**/*.html"]

# Workers AI binding
[ai]
binding = "AI"

# D1 audit log database
# Create with: npx wrangler d1 create ocr-logs
# Then replace database_id below with the ID it prints
[[d1_databases]]
binding      = "DB"
database_name = "ocr-logs"
database_id  = "2a7f71a5-5cf0-4f06-b99a-110269ebba4c"

# Custom domain — domain must be on Cloudflare (proxied)
[[routes]]
pattern = "nikke.driftmail.eu/*"
zone_name = "driftmail.eu"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

# Set these as secrets via:
#   wrangler secret put OCR_USER   ← your personal admin account
#   wrangler secret put OCR_PASS
#   wrangler secret put UNION_USER ← shared guild account
#   wrangler secret put UNION_PASS